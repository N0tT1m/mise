[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mise-pipeline"
version = "0.1.0"
description = "Offline pipeline for Mise: ingest -> extract -> resolve -> publish."
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary]>=3.2",
    "click>=8.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
mise-pipeline = "mise.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
