services:
  pgvector:
    image: pgvector/pgvector:pg17
    container_name: pgvector-db
    restart: unless-stopped
    ports:
      - "16432:5432"
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      - POSTGRES_DB=${POSTGRES_DATABASE:?set POSTGRES_DATABASE in .env}
      - POSTGRES_USER=${POSTGRES_USERNAME:?set POSTGRES_USERNAME in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/001_schema.sql:/docker-entrypoint-initdb.d/001_schema.sql
      - ./db/002_seed.sql:/docker-entrypoint-initdb.d/002_seed.sql

volumes:
  pgdata:
